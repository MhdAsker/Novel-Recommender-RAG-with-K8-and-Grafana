apiVersion: apps/v1
kind: Deployment
metadata:
  name: novels-recommender-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novels-recommender
  template:
    metadata:
      labels:
        app: novels-recommender
    spec:
      containers:
        - name: novels-recommender-container
          image: novels-recommender:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: llmops-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: novels-recommender-service
spec:
  type: NodePort
  selector:
    app: novels-recommender
  ports:
    - port: 80
      targetPort: 8501
      nodePort: 30007


